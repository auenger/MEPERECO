appId: ai.silieco.desktop
productName: MEPERStudio
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-upd\
    ate.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!dist/**"
protocols:
  - name: MEPERStudio
    schemes:
      - silieco
asarUnpack:
  - resources/**
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: silieco-desktop-${version}-mac-${arch}.${ext}
  notarize: true
dmg:
  artifactName: silieco-desktop-${version}-mac-${arch}.${ext}
linux:
  executableName: silieco-desktop
  desktop:
    entry:
      StartupWMClass: MEPERStudio
  icon: build/icons
  target:
    - AppImage
    - deb
    - rpm
  artifactName: silieco-desktop-${version}-linux-${arch}.${ext}
rpm:
  fpm:
    - --rpm-rpmbuild-define=_build_id_links none
win:
  target:
    - nsis
  artifactName: silieco-desktop-${version}-windows-${arch}.${ext}
publish: null
npmRebuild: false
