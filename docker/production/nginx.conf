map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
server {
    listen 80 default_server;
    server_name studio.meper.cn _;
    client_max_body_size 256m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /health { proxy_pass http://backend:8080; }
    location = /ws { proxy_pass http://backend:8080; proxy_buffering off; }
    location /api/ { proxy_pass http://backend:8080; proxy_buffering off; }
    location /uploads/ { proxy_pass http://backend:8080; }
    location /updates/desktop/ { proxy_pass http://backend:8080; proxy_buffering off; }
    location /auth/callback { proxy_pass http://frontend:3000; }
    location /auth/hg-sso/callback { proxy_pass http://frontend:3000; }
    location /auth/ { proxy_pass http://backend:8080; proxy_buffering off; }
    location / { proxy_pass http://frontend:3000; }
}
